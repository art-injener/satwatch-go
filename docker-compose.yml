services:
  satellite-scout:
    build: .
    container_name: satellite-scout
    ports:
      - "8080:8080"
    environment:
      # Единственные переменные окружения: путь к файлу настроек и режим запуска.
      # Все прочие параметры (порт, координаты, тема, TLE, SatNOGS, схема станции)
      # хранятся внутри data/config.json и редактируются через UI «Настройки».
      - SS_CONFIG=/app/data/config.json
      - DEV_MODE=false
    volumes:
      # Папка `data` хранит config.json, кеш TLE и список исключений.
      - ./data:/app/data
    restart: unless-stopped
