{{define "passes-content"}}
<div class="passes-layout">
    <header class="passes-header">
        <h2>Пролёты спутников</h2>
        <p class="passes-subtitle">Расписание видимых пролётов над точкой наблюдения (все группы)</p>
    </header>

    <!-- Контейнер для таблицы пролётов -->
    <div class="passes-table-container" id="passes-table-container">
        <!-- Таблица будет загружена через JS -->
        <div class="passes-loading">
            <div class="spinner"></div>
            <span>Загрузка пролётов...</span>
        </div>
    </div>
</div>
{{end}}
